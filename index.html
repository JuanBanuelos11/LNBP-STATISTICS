<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LNBP Advanced Stats — 2026 Season</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1218; --panel:#FFFFFF; --ink:#14161A; --ink-2:#5A6270;
  --line:#D2D6DE; --line-2:#E7EAEF; --campo:#EDEFF3;
  --tinta:#0E1218; --azul:#12386E; --azul-2:#1B58AD; --rojo:#C0102B; --ambar:#C8871B;
  --pos:#1B58AD; --neg:#C0102B; --dato:#1B58AD; --verde:#2E7D46;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--campo);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;
  font-size:14px;line-height:1.45;padding-bottom:56px}
.wrap{max-width:1560px;margin:0 auto;padding:0 16px}

/* ---------- cabecera ---------- */
.masthead{background:var(--tinta);color:#fff;border-bottom:3px solid var(--rojo)}
.masthead .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;padding:18px 16px 14px}
.marca{display:flex;align-items:baseline;gap:11px}
.marca h1{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:.02em;line-height:.9}
.marca h1 em{font-style:normal;color:#8FA9CE}
.marca .liga{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:#8FA9CE;border:1px solid #2C3A4D;padding:3px 7px;border-radius:var(--r)}
.credito{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:.11em;text-transform:uppercase;color:#77879C;text-align:right}

.tabs{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
.tab{appearance:none;background:none;border:0;cursor:pointer;font-family:'Bebas Neue',sans-serif;
  font-size:19px;letter-spacing:.045em;color:var(--ink-2);padding:12px 17px 9px;
  border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--azul);border-bottom-color:var(--rojo)}
.tab:focus-visible{outline:2px solid var(--azul-2);outline-offset:-2px}

.filtros{background:var(--panel);border-bottom:1px solid var(--line)}
.filtros .wrap{display:flex;flex-wrap:wrap;gap:13px 17px;padding:11px 16px}
.campo{display:flex;flex-direction:column;gap:4px}
.campo label{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.campo select,.campo input{font-family:'Manrope',sans-serif;font-size:13px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;min-width:128px}
.campo input[type=number]{min-width:72px}
.campo select:focus,.campo input:focus{outline:2px solid var(--azul-2);outline-offset:-1px}
.reset{align-self:flex-end;background:none;border:1px solid var(--line);border-radius:var(--r);
  padding:6px 11px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.reset:hover{border-color:var(--azul);color:var(--azul)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-top:16px;overflow:hidden}
.panel-top{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel-top h2{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.03em}
.pag{margin-left:auto;display:flex;align-items:center;gap:8px;
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-2)}
.pag button{background:#fff;border:1px solid var(--line);border-radius:var(--r);
  width:26px;height:24px;cursor:pointer;color:var(--ink-2);font-size:12px;line-height:1}
.pag button:disabled{opacity:.35;cursor:default}
.pag button:not(:disabled):hover{border-color:var(--azul);color:var(--azul)}
.pag select{border:1px solid var(--line);border-radius:var(--r);padding:2px 4px;
  font-family:'JetBrains Mono',monospace;font-size:11px}

/* ---------- tabla ---------- */
.scroll{overflow-x:auto;max-height:74vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
thead th{position:sticky;top:0;z-index:10;background:#F4F5F8;
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);padding:9px 7px;text-align:right;white-space:nowrap;
  cursor:pointer;border-bottom:1px solid var(--line);user-select:none}
thead th.txt{text-align:left}
thead th:hover{color:var(--azul)}
thead th[data-dir]{color:var(--azul);box-shadow:inset 0 3px 0 var(--rojo)}
thead th[data-dir]::after{content:' ▾';font-size:9px}
thead th[data-dir="asc"]::after{content:' ▴'}
tbody td{padding:7px;text-align:right;border-bottom:1px solid var(--line-2);
  font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody td.txt{text-align:left;font-family:'Manrope',sans-serif;font-weight:500}
tbody td.dato{color:var(--dato)}
tbody tr:hover td{background:#F7F8FA}
.rank{color:var(--ink-2);font-size:11px;width:38px}
.equipo{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;color:var(--azul)}
.eqlink{cursor:pointer}
.eqlink:hover{text-decoration:underline}
.quinteto{display:flex;flex-wrap:wrap;gap:3px;max-width:400px;white-space:normal}
.quinteto span{font-family:'Manrope',sans-serif;font-size:10.5px;font-weight:600;
  background:#EEF1F6;border:1px solid var(--line-2);border-radius:2px;padding:2px 5px}
.rol{font-family:'Manrope',sans-serif;font-size:10.5px;font-weight:600;color:#4A5568;
  background:#F1F3F7;border-radius:2px;padding:2px 6px;white-space:nowrap}
.forma{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;color:var(--azul);
  background:#EEF1F6;border-radius:2px;padding:2px 7px}
.advert{font-family:'JetBrains Mono',monospace;font-size:10px;color:#9A6B10;margin-left:5px}

.pm{padding:5px 7px !important}
.pm .env{display:flex;align-items:center;justify-content:flex-end;gap:9px}
.pm .pista{position:relative;width:74px;height:12px;flex:0 0 74px}
.pm .pista::before{content:'';position:absolute;left:50%;top:-1px;bottom:-1px;width:1px;background:#CBD1DB}
.pm i{position:absolute;top:1px;height:10px;border-radius:1px;opacity:.9}
.pm i.p{left:50%;background:var(--pos)}
.pm i.n{right:50%;background:var(--neg)}
.pm b{min-width:44px;text-align:right;font-weight:700}
.pm.p b{color:var(--pos)} .pm.n b{color:var(--neg)}
.pm.cero b{color:var(--ink-2)}

.aviso{padding:11px 14px;background:#FBF6E9;border-top:1px solid var(--line-2);font-size:11.5px;color:#7A6320}
.vacio{padding:44px 14px;text-align:center;color:var(--ink-2)}
.cargando{padding:60px 14px;text-align:center;color:var(--ink-2);font-family:'JetBrains Mono',monospace;font-size:12px}
.ok{color:var(--verde);font-size:11px}
.parcial{color:#9A6B10;font-size:11px;background:#FBF3DF;border-radius:2px;padding:1px 5px}

/* ---------- panel de liga y de equipo ---------- */
.rejilla{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;margin-top:16px}
.caja{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.caja h3{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.04em;
  padding:10px 14px;border-bottom:1px solid var(--line-2)}
.caja .cuerpo{padding:14px}
.leyenda{font-size:11.5px;color:var(--ink-2);padding:0 14px 12px}
svg{display:block;width:100%;height:auto}
.eje{stroke:var(--line);stroke-width:1}
.guia{stroke:#C9CFDA;stroke-dasharray:3 3;stroke-width:1}
.ejeTxt{font-family:'JetBrains Mono',monospace;font-size:9px;fill:var(--ink-2)}
.cuad{font-family:'JetBrains Mono',monospace;font-size:8.5px;fill:#A6AEBC;letter-spacing:.08em}
.pto{cursor:pointer}
.ptoTxt{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;fill:#fff;pointer-events:none}

.barras{display:flex;flex-direction:column;gap:7px}
.barra{display:grid;grid-template-columns:120px 1fr 46px;align-items:center;gap:9px;font-size:12.5px}
.barra .nom{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra .pista{background:#EEF1F6;border-radius:2px;height:15px;position:relative}
.barra .rell{position:absolute;left:0;top:0;bottom:0;background:var(--azul-2);border-radius:2px}
.barra .val{font-family:'JetBrains Mono',monospace;font-size:11.5px;text-align:right;color:var(--ink-2)}

/* ficha de equipo */
.ficha{background:var(--tinta);color:#fff;border-radius:var(--r);padding:18px;
  display:flex;flex-wrap:wrap;align-items:center;gap:22px;margin-top:16px}
.ficha .nom{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:.02em;line-height:1}
.ficha .cod{font-family:'JetBrains Mono',monospace;font-size:11px;color:#8FA9CE;letter-spacing:.14em}
.ficha .mets{margin-left:auto;display:flex;flex-wrap:wrap;gap:20px}
.ficha .mets div{text-align:right}
.ficha .mets b{display:block;font-family:'JetBrains Mono',monospace;font-size:19px}
.ficha .mets span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#77879C}
.pos{color:#7FB0FF} .neg2{color:#FF8A8A}
.selector{padding:44px 14px;text-align:center;color:var(--ink-2)}

@media (max-width:900px){ .rejilla{grid-template-columns:1fr} }
@media (max-width:720px){
  .marca h1{font-size:28px}
  .credito{width:100%;margin-left:0;text-align:left;font-size:9px}
  .quinteto{max-width:200px}
  .ficha .mets{margin-left:0;width:100%;justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="marca"><h1>LNBP <em>Advanced Stats</em></h1><span class="liga">2026 Season</span></div>
    <div class="credito">Juan Pablo Bañuelos Mendoza · Scout &amp; Data Analyst</div>
  </div>
</header>

<nav class="tabs" role="tablist">
  <div class="wrap">
    <button class="tab" role="tab" data-vista="liga" aria-selected="true">League</button>
    <button class="tab" role="tab" data-vista="equipos" aria-selected="false">Teams</button>
    <button class="tab" role="tab" data-vista="ficha" aria-selected="false">Team Page</button>
    <button class="tab" role="tab" data-vista="jugadores" aria-selected="false">Players</button>
    <button class="tab" role="tab" data-vista="quintetos" aria-selected="false">Lineups</button>
  </div>
</nav>

<section class="filtros">
  <div class="wrap">
    <div class="campo" id="campoTipo">
      <label for="fTipo">Table view</label>
      <select id="fTipo"><option value="trad">Traditional</option><option value="adv">Advanced</option><option value="roles">Roles</option></select>
    </div>
    <div class="campo">
      <label for="fEquipo">Team</label>
      <select id="fEquipo"><option value="">All</option></select>
    </div>
    <div class="campo" id="campoRival">
      <label for="fRival">Opponent</label>
      <select id="fRival"><option value="">All</option></select>
    </div>
    <div class="campo" id="campoRol">
      <label for="fRol">Offensive role</label>
      <select id="fRol"><option value="">All</option></select>
    </div>
    <div class="campo" id="campoModo">
      <label for="fModo">Per mode</label>
      <select id="fModo">
        <option value="juego">Per game</option>
        <option value="total">Totals</option>
        <option value="40">Per 40 min</option>
        <option value="100">Per 100 possessions</option>
      </select>
    </div>
    <div class="campo" id="campoSede">
      <label for="fSede">Location</label>
      <select id="fSede"><option value="">Home &amp; away</option><option value="1">Home only</option><option value="0">Away only</option></select>
    </div>
    <div class="campo" id="campoRes">
      <label for="fResultado">Outcome</label>
      <select id="fResultado"><option value="">All</option><option value="W">Wins</option><option value="L">Losses</option></select>
    </div>
    <div class="campo" id="campoUlt">
      <label for="fUltimos">Last N games</label>
      <select id="fUltimos"><option value="">Full season</option><option value="3">Last 3</option><option value="5">Last 5</option><option value="10">Last 10</option></select>
    </div>
    <div class="campo" id="campoDesde"><label for="fDesde">From</label><input type="date" id="fDesde"></div>
    <div class="campo" id="campoHasta"><label for="fHasta">To</label><input type="date" id="fHasta"></div>
    <div class="campo" id="campoCalidad">
      <label for="fCalidad">Data quality</label>
      <select id="fCalidad">
        <option value="">All games</option>
        <option value="1">Complete games only</option>
      </select>
    </div>
    <div class="campo" id="campoMinJ">
      <label for="fMinJ">Min. games</label>
      <select id="fMinJ">
        <option value="0">No minimum</option><option value="3">3 or more</option>
        <option value="5" selected>5 or more</option><option value="8">8 or more</option><option value="10">10 or more</option>
      </select>
    </div>
    <div class="campo" id="campoMin">
      <label for="fMin">Min. minutes</label>
      <input type="number" id="fMin" value="0" min="0" step="5">
    </div>
    <button class="reset" id="bReset">Clear filters</button>
  </div>
</section>

<main class="wrap" id="lienzo">
  <div class="panel" id="panelTabla">
    <div class="panel-top">
      <h2 id="titulo">League</h2>
      <div class="pag">
        <span id="conteo"></span>
        <button id="bPrev" aria-label="Previous page">&lsaquo;</button>
        <span>Page</span>
        <select id="fPagina"></select>
        <span id="dePag"></span>
        <button id="bNext" aria-label="Next page">&rsaquo;</button>
      </div>
    </div>
    <div class="scroll" id="salida"><div class="cargando">Loading season data…</div></div>
    <div class="aviso" id="aviso" hidden></div>
  </div>
  <div id="libre"></div>
</main>

<footer style="padding:26px 16px;text-align:center;font-size:11px;color:var(--ink-2)">
  Lineups reconstructed from official LNBP play-by-play and validated against the official box score<br>
  <b style="color:var(--ink)">Juan Pablo Bañuelos Mendoza</b> — Scout &amp; Data Analyst · <span id="pieFecha"></span>
</footer>

<script>
'use strict';

const S = {jugadores:[], quintetos:[], juegos:[], equipos:[], roles:{}, vista:'liga', pagina:1, porPagina:50,
  orden:{equipos:['win','desc'], jugadores:['pts','desc'], quintetos:['minTot','desc'], juegos:['fecha','desc']}};

const NUM = ['num','local','titular','dnp','segundos','minutos','pts','reb','ast','tc','ti','2pc','2pi',
  '3pc','3pi','tlc','tli','ro','rd','pe','rec','blq','tf','fr','ef','pc','plus_minus','seg_pbp','stints',
  'fgm','fga','tpm','tpa','ftm','fta','oreb','dreb','tov','stl','blk','pf','pfd',
  'opp_pts','opp_fgm','opp_fga','opp_tpm','opp_tpa','opp_ftm','opp_fta','opp_oreb','opp_dreb',
  'opp_ast','opp_tov','opp_stl','opp_blk','opp_pf','opp_pfd'];

const n1 = v => isFinite(v) ? (Math.round(v*10)/10).toFixed(1) : '—';
const n2 = v => isFinite(v) ? (Math.round(v*100)/100).toFixed(2) : '—';
const n3 = v => isFinite(v) ? v.toFixed(3).replace(/^0/,'') : '—';
const ent = v => isFinite(v) ? Math.round(v) : '—';
const firma = v => !isFinite(v) ? '—' : (v > 0 ? '+' : '') + (Math.round(v*10)/10).toFixed(1);
const div = (a,b) => b > 0 ? a/b : NaN;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* los 11 roles se agrupan en tres familias de posición */
function familia(rol){
  if(!rol) return '';
  const r = rol.toLowerCase();
  if(r.includes('ball handler')) return 'Guard';
  if(r.includes('wing')) return 'Wing';
  if(r.includes('big')) return 'Big';
  return 'Other';
}
const SIGLA = {Guard:'G', Wing:'W', Big:'B'};

/* celda de +/-: barra divergente desde el cero, con el número aparte */
function celdaPM(valor, max){
  const x = isFinite(valor) ? valor : 0;
  const clase = x > 0 ? 'p' : (x < 0 ? 'n' : 'cero');
  const ancho = (Math.abs(x) / (max || 1) * 36).toFixed(1);
  const barra = x === 0 ? '' : `<i class="${clase}" style="width:${ancho}px"></i>`;
  return `<td class="pm ${clase}"><span class="env"><span class="pista">${barra}</span><b>${firma(x)}</b></span></td>`;
}

/* ---------- carga ---------- */
function cargar(){
  const P = JSON.parse(document.getElementById('datos').textContent);
  const arma = t => t.filas.map(f => {
    const o = {};
    t.cols.forEach((c, i) => o[c] = f[i]);
    return o;
  });
  S.jugadores = arma(P.players);
  S.quintetos = arma(P.lineups);
  S.roles = {};
  arma(P.roles).forEach(r => S.roles[r.equipo + '|' + r.jugador] = r.rol);
  S.juegos = P.meta.juegos;
  S.equipos = P.meta.equipos;
  prepara(P.meta);
  pintar();
}

function prepara(meta){
  S.marcador = {}; S.cobertura = {};
  meta.juegos.forEach(g => {
    S.marcador[g.id+'|'+g.local]  = {pf:g.pts_local,  pc:g.pts_visita};
    S.marcador[g.id+'|'+g.visita] = {pf:g.pts_visita, pc:g.pts_local};
    S.cobertura[g.id] = g.cob === undefined ? 1 : g.cob;
  });
  S.incompletos = meta.juegos.filter(g => (g.cob === undefined ? 1 : g.cob) < 0.995).length;

  S.eqJuego = {};
  S.jugadores.forEach(r => {
    const k = r.game_id+'|'+r.equipo;
    (S.eqJuego[k] ||= {fga:0, fta:0, tov:0, min:0});
    S.eqJuego[k].fga += r.ti; S.eqJuego[k].fta += r.tli;
    S.eqJuego[k].tov += r.pe; S.eqJuego[k].min += r.minutos;
  });

  pieFecha.textContent = 'Data through ' + meta.actualizado;

  const op = S.equipos.map(e => `<option value="${e.code}">${esc(e.nombre)}</option>`).join('');
  fEquipo.insertAdjacentHTML('beforeend', op);
  fRival.insertAdjacentHTML('beforeend', op);
  fRol.insertAdjacentHTML('beforeend',
    [...new Set(Object.values(S.roles))].sort().map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join(''));
}

/* ---------- filtros ---------- */
function filtrar(filas){
  const eq = fEquipo.value, riv = fRival.value, sede = fSede.value, res = fResultado.value;
  const desde = fDesde.value, hasta = fHasta.value, ult = fUltimos.value;
  let out = filas.filter(r =>
    (!eq || r.equipo === eq) && (!riv || r.rival === riv) &&
    (!desde || r.fecha >= desde) && (!hasta || r.fecha <= hasta) &&
    (sede === '' || r.local === undefined || +r.local === +sede));
  if(fCalidad.value) out = out.filter(r => (S.cobertura[r.game_id] || 1) >= 0.995);
  if(res) out = out.filter(r => {
    const m = S.marcador[r.game_id+'|'+r.equipo];
    return !m ? true : (res === 'W' ? m.pf > m.pc : m.pf < m.pc);
  });
  if(ult){
    const pe = {};
    out.forEach(r => (pe[r.equipo] ||= new Set()).add(r.fecha));
    const corte = {};
    for(const e in pe) corte[e] = [...pe[e]].sort().slice(-(+ult))[0];
    out = out.filter(r => r.fecha >= corte[r.equipo]);
  }
  return out;
}

const posesiones = t => t.fga - t.oreb + t.tov + 0.44*t.fta;

const MAPA = {pts:'pts', fgm:'tc', fga:'ti', tpm:'3pc', tpa:'3pi', ftm:'tlc', fta:'tli',
  oreb:'ro', dreb:'rd', ast:'ast', tov:'pe', stl:'rec', blk:'blq', pf:'tf', pfd:'fr',
  minutos:'minutos', plus_minus:'plus_minus'};
const CLAVES = Object.keys(MAPA);

function caja(filas){
  const t = {};
  CLAVES.forEach(k => t[k] = 0);
  filas.forEach(r => CLAVES.forEach(k => t[k] += (+r[MAPA[k]] || 0)));
  t.reb = t.oreb + t.dreb;
  return t;
}

function escala(t, juegos, modo){
  let d = 1;
  if(modo === 'juego') d = juegos || 1;
  else if(modo === '40') d = (t.minutos/40) || 1;
  else if(modo === '100') d = (posesiones(t)/100) || 1;
  const o = {};
  for(const k in t) o[k] = (modo === 'total') ? t[k] : t[k]/d;
  o.minutos = modo === 'total' ? t.minutos : t.minutos/(juegos || 1);
  return o;
}

function datosEquipos(filasBase){
  const filas = filasBase || filtrar(S.jugadores), modo = fModo.value;
  const porEq = {};
  filas.forEach(r => (porEq[r.equipo] ||= []).push(r));
  return Object.entries(porEq).map(([eq, rs]) => {
    const ids = new Set(rs.map(r => r.game_id));
    const opp = S.jugadores.filter(r => ids.has(r.game_id) && r.equipo !== eq);
    const t = caja(rs), to = caja(opp), g = ids.size;
    let w = 0; ids.forEach(id => {const m = S.marcador[id+'|'+eq]; if(m && m.pf > m.pc) w++;});
    const e = escala(t, g, modo), pos = posesiones(t), poso = posesiones(to);
    return {equipo:eq, nombre:(S.equipos.find(x => x.code === eq) || {}).nombre || eq,
      gp:g, w, l:g-w, win:div(w,g),
      min:modo === 'total' ? t.minutos/5 : div(t.minutos, 5*g),
      pts:e.pts, fgm:e.fgm, fga:e.fga, fgp:div(t.fgm,t.fga)*100,
      tpm:e.tpm, tpa:e.tpa, tpp:div(t.tpm,t.tpa)*100,
      ftm:e.ftm, fta:e.fta, ftp:div(t.ftm,t.fta)*100,
      oreb:e.oreb, dreb:e.dreb, reb:e.reb, ast:e.ast, tov:e.tov, stl:e.stl, blk:e.blk, pf:e.pf,
      pm:div(t.pts-to.pts, g),
      ortg:div(t.pts,pos)*100, drtg:div(to.pts,poso)*100,
      net:div(t.pts,pos)*100 - div(to.pts,poso)*100,
      astp:div(t.ast,t.fgm)*100, astto:div(t.ast,t.tov),
      orebp:div(t.oreb, t.oreb+to.dreb)*100, drebp:div(t.dreb, t.dreb+to.oreb)*100,
      rebp:div(t.reb, t.reb+to.reb)*100, tovp:div(t.tov,pos)*100,
      efg:div(t.fgm+0.5*t.tpm, t.fga)*100, ts:div(t.pts, 2*(t.fga+0.44*t.fta))*100,
      pace:div(pos,g),
      ...repartoRoles(rs, eq)};
  });
}

/* qué proporción de los minutos de un equipo va a cada familia, y con qué eficiencia */
function repartoRoles(filas, eq){
  const fam = {Guard:{min:0, pts:0, fga:0, fta:0}, Wing:{min:0, pts:0, fga:0, fta:0},
               Big:{min:0, pts:0, fga:0, fta:0}};
  let total = 0, conRol = 0;
  filas.forEach(r => {
    total += r.minutos;
    const f = familia(S.roles[eq+'|'+r.jugador]);
    if(!fam[f]) return;
    conRol += r.minutos;
    fam[f].min += r.minutos; fam[f].pts += r.pts;
    fam[f].fga += r.ti; fam[f].fta += r.tli;
  });
  const o = {minSinRol: total - conRol};
  for(const f in fam){
    o['min' + f] = div(fam[f].min, total) * 100;
    o['ts' + f] = div(fam[f].pts, 2*(fam[f].fga + 0.44*fam[f].fta)) * 100;
  }
  return o;
}

function datosJugadores(filasBase){
  const filas = (filasBase || filtrar(S.jugadores)).filter(r => r.minutos > 0);
  const modo = fModo.value, minMin = +fMin.value || 0, minJ = +fMinJ.value || 0, rolF = fRol.value;
  const porJ = {};
  filas.forEach(r => (porJ[r.equipo+'|'+r.jugador] ||= []).push(r));

  return Object.entries(porJ).map(([k, rs]) => {
    const [eq, nombre] = k.split('|');
    const t = caja(rs), g = rs.length, e = escala(t, g, modo);
    let jugEq = 0, minEq = 0;
    rs.forEach(r => {
      const q = S.eqJuego[r.game_id+'|'+eq];
      if(q){ jugEq += q.fga + 0.44*q.fta + q.tov; minEq += q.min; }
    });
    const jug = t.fga + 0.44*t.fta + t.tov;
    const rolJ = S.roles[k] || '';
    return {equipo:eq, jugador:nombre, rol:rolJ, fam:familia(rolJ), gp:g, tit:rs.filter(r => r.titular).length,
      minTot:t.minutos, min:e.minutos,
      pts:e.pts, fgm:e.fgm, fga:e.fga, fgp:div(t.fgm,t.fga)*100,
      tpm:e.tpm, tpa:e.tpa, tpp:div(t.tpm,t.tpa)*100,
      ftm:e.ftm, fta:e.fta, ftp:div(t.ftm,t.fta)*100,
      oreb:e.oreb, dreb:e.dreb, reb:e.reb, ast:e.ast, tov:e.tov, stl:e.stl, blk:e.blk, pf:e.pf,
      pm:t.plus_minus,
      usg:div(jug * (minEq/5), t.minutos * jugEq)*100,
      efg:div(t.fgm+0.5*t.tpm, t.fga)*100, ts:div(t.pts, 2*(t.fga+0.44*t.fta))*100,
      tpar:div(t.tpa,t.fga)*100, ftr:div(t.fta,t.fga)*100, astto:div(t.ast,t.tov),
      pm40:div(t.plus_minus, t.minutos)*40};
  }).filter(r => r.minTot >= minMin && r.gp >= minJ && (!rolF || r.rol === rolF));
}

/* promedios por rol, para medir a cada jugador contra su propio arquetipo */
function promediosPorRol(lista){
  const acc = {};
  lista.forEach(j => {
    if(!j.rol) return;
    (acc[j.rol] ||= {ts:[], usg:[], tpar:[]});
    if(isFinite(j.ts)) acc[j.rol].ts.push(j.ts);
    if(isFinite(j.usg)) acc[j.rol].usg.push(j.usg);
    if(isFinite(j.tpar)) acc[j.rol].tpar.push(j.tpar);
  });
  const med = a => a.length ? a.reduce((x,y) => x+y, 0)/a.length : NaN;
  const out = {};
  for(const r in acc) out[r] = {ts:med(acc[r].ts), usg:med(acc[r].usg), tpar:med(acc[r].tpar)};
  return out;
}

function datosQuintetos(filasBase){
  const filas = filasBase || filtrar(S.quintetos);
  const modo = fModo.value, minMin = +fMin.value || 0;
  const C = ['minutos','pts','fgm','fga','tpm','tpa','ftm','fta','oreb','dreb','ast','tov','stl','blk','pf'];
  const O = C.filter(c => c !== 'minutos').map(c => 'opp_'+c);
  const acc = {};
  filas.forEach(r => {
    const k = r.equipo+'|'+r.lineup;
    if(!acc[k]){
      acc[k] = {equipo:r.equipo, lineup:r.lineup, juegos:new Set(), stints:0};
      C.concat(O).forEach(c => acc[k][c] = 0);
    }
    C.concat(O).forEach(c => acc[k][c] += (+r[c] || 0));
    acc[k].stints += r.stints; acc[k].juegos.add(r.game_id);
  });
  return Object.values(acc).map(q => {
    const g = q.juegos.size;
    q.reb = q.oreb + q.dreb;
    const oppReb = q.opp_oreb + q.opp_dreb;
    const e = escala(q, g, modo);
    const pos = posesiones(q);
    const poso = posesiones({fga:q.opp_fga, oreb:q.opp_oreb, tov:q.opp_tov, fta:q.opp_fta});
    return {equipo:q.equipo, lineup:q.lineup, gp:g, stints:q.stints, minTot:q.minutos, min:e.minutos,
      pts:e.pts, fgm:e.fgm, fga:e.fga, fgp:div(q.fgm,q.fga)*100,
      tpm:e.tpm, tpa:e.tpa, tpp:div(q.tpm,q.tpa)*100,
      ftm:e.ftm, fta:e.fta, ftp:div(q.ftm,q.fta)*100,
      oreb:e.oreb, dreb:e.dreb, reb:e.oreb+e.dreb, ast:e.ast, tov:e.tov, stl:e.stl, blk:e.blk, pf:e.pf,
      pm:q.pts - q.opp_pts,
      ortg:div(q.pts,pos)*100, drtg:div(q.opp_pts,poso)*100,
      net:div(q.pts,pos)*100 - div(q.opp_pts,poso)*100,
      astp:div(q.ast,q.fgm)*100, astto:div(q.ast,q.tov),
      orebp:div(q.oreb, q.oreb+q.opp_dreb)*100, drebp:div(q.dreb, q.dreb+q.opp_oreb)*100,
      rebp:div(q.reb, q.reb+oppReb)*100,
      efg:div(q.fgm+0.5*q.tpm,q.fga)*100, ts:div(q.pts, 2*(q.fga+0.44*q.fta))*100,
      pace:div(pos, q.minutos/40),
      forma:composicion(q.equipo, q.lineup), sinRol:sinRol(q.equipo, q.lineup)};
  }).filter(q => q.minTot >= minMin);
}

/* composición del quinteto en bases / aleros / interiores, tipo 2-2-1 */
function composicion(eq, lineup){
  const c = {Guard:0, Wing:0, Big:0};
  lineup.split(' | ').forEach(n => { const f = familia(S.roles[eq+'|'+n]); if(c[f] !== undefined) c[f]++; });
  return `${c.Guard}-${c.Wing}-${c.Big}`;
}
function sinRol(eq, lineup){
  return lineup.split(' | ').filter(n => !S.roles[eq+'|'+n]).length;
}

function datosJuegos(){
  const eq = fEquipo.value, riv = fRival.value, desde = fDesde.value, hasta = fHasta.value;
  return S.juegos.filter(g => (!eq || g.local === eq || g.visita === eq) &&
    (!riv || g.local === riv || g.visita === riv) &&
    (!desde || g.fecha >= desde) && (!hasta || g.fecha <= hasta) &&
    (!fCalidad.value || (g.cob === undefined ? 1 : g.cob) >= 0.995))
  .map(g => ({fecha:g.fecha, local:g.local, visita:g.visita, pts_local:g.pts_local, pts_visita:g.pts_visita,
    margen:Math.abs(g.pts_local-g.pts_visita), total:g.pts_local+g.pts_visita,
    ganador:g.pts_local > g.pts_visita ? g.local : g.visita,
    cob:(g.cob === undefined ? 1 : g.cob) * 100}));
}

/* ---------- panorama de la liga ---------- */
function pintarLiga(){
  const eqs = datosEquipos();
  const xs = eqs.map(e => e.ortg), ys = eqs.map(e => e.drtg);
  const W = 700, H = 460, M = {t:22, r:22, b:44, l:52};
  const x0 = Math.min(...xs) - 3, x1 = Math.max(...xs) + 3;
  const y0 = Math.min(...ys) - 3, y1 = Math.max(...ys) + 3;
  const mx = xs.reduce((a,b) => a+b, 0)/xs.length, my = ys.reduce((a,b) => a+b, 0)/ys.length;
  const px = v => M.l + (v - x0)/(x1 - x0) * (W - M.l - M.r);
  const py = v => M.t + (v - y0)/(y1 - y0) * (H - M.t - M.b);   // defensa: arriba = mejor

  const ptos = eqs.map(e => {
    const c = e.net >= 0 ? '#1B58AD' : '#C0102B';
    return `<g class="pto" data-eq="${e.equipo}">
      <circle cx="${px(e.ortg).toFixed(1)}" cy="${py(e.drtg).toFixed(1)}" r="15"
        fill="${c}" fill-opacity="${(0.35 + Math.min(Math.abs(e.net)/22, 1)*0.6).toFixed(2)}"

    </g>`;
  }).join('');

  const marcasX = [...Array(5)].map((_,i) => x0 + (x1-x0)*i/4);
  const marcasY = [...Array(5)].map((_,i) => y0 + (y1-y0)*i/4);

  const svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img"
      aria-label="Scatter plot of offensive versus defensive efficiency by team">
    <line class="guia" x1="${px(mx)}" y1="${M.t}" x2="${px(mx)}" y2="${H-M.b}"/>

    <text class="cuad" x="${M.l+4}" y="${M.t+12}">STOPS, CAN'T SCORE</text>

    ${marcasY.map(v => `<text class="ejeTxt" x="${M.l-8}" y="${(py(v)+3).toFixed(1)}" text-anchor="end">${n1(v)}</text>`).join('')}
    <line class="eje" x1="${M.l}" y1="${H-M.b}" x2="${W-M.r}" y2="${H-M.b}"/>
    <line class="eje" x1="${M.l}" y1="${M.t}" x2="${M.l}" y2="${H-M.b}"/>
    <text class="ejeTxt" x="${(M.l+W-M.r)/2}" y="${H-8}" text-anchor="middle">OFFENSIVE RATING (POINTS PER 100 POSSESSIONS) →</text>

    ${ptos}
  </svg>`;

  const barra = (lista, campo, fmt, inv) => {
    const orden = [...lista].sort((a,b) => inv ? a[campo]-b[campo] : b[campo]-a[campo]).slice(0,8);
    const max = Math.max(...orden.map(o => Math.abs(o[campo])));
    return `<div class="barras">${orden.map(o => `
      <div class="barra">
        <span class="nom"><span class="equipo eqlink" data-eq="${o.equipo}">${o.equipo}</span> ${esc(o.nombre.split(' de ')[0])}</span>
        <span class="pista"><i class="rell" style="width:${(Math.abs(o[campo])/max*100).toFixed(1)}%"></i></span>
        <span class="val">${fmt(o[campo])}</span>
      </div>`).join('')}</div>`;
  };

  const jug = datosJugadores();
  const porRol = {};
  jug.forEach(j => { if(j.rol) (porRol[j.rol] ||= []).push(j); });
  const filasRol = Object.entries(porRol).sort((a,b) => b[1].length - a[1].length).map(([rol, js]) => {
    const ts = js.reduce((a,j) => a + (isFinite(j.ts) ? j.ts : 0), 0)/js.length;
    const uso = js.reduce((a,j) => a + (isFinite(j.usg) ? j.usg : 0), 0)/js.length;
    return `<tr><td class="txt"><span class="rol">${esc(rol)}</span></td><td>${js.length}</td>
      <td>${n1(uso)}</td><td>${n1(ts)}</td></tr>`;
  }).join('');

  libre.innerHTML = `
    <div class="rejilla">
      <div class="caja">
        <h3>Who scores and who stops</h3>
        <div class="cuerpo">${svg}</div>
        <p class="leyenda">Each bubble is a team; colour intensity marks net rating. Dashed lines are the league average.
          The complete teams live in the top-right quadrant.</p>
      </div>
      <div>
        <div class="caja">
          <h3>Best offense · points per 100 possessions</h3>
          <div class="cuerpo">${barra(eqs, 'ortg', n1, false)}</div>
        </div>
        <div class="caja" style="margin-top:16px">
          <h3>Best defense · points allowed per 100</h3>
          <div class="cuerpo">${barra(eqs, 'drtg', n1, true)}</div>
        </div>
      </div>
    </div>
    <div class="rejilla">
      <div class="caja">
        <h3>Pace · possessions per game</h3>
        <div class="cuerpo">${barra(eqs, 'pace', n1, false)}</div>
      </div>
      <div class="caja">
        <h3>Offensive archetypes across the league</h3>
        <div class="scroll" style="max-height:none">
          <table><thead><tr><th class="txt">Role</th><th>Players</th><th>USG%</th><th>TS%</th></tr></thead>
          <tbody>${filasRol}</tbody></table>
        </div>
        <p class="leyenda">Proprietary classification of the 145 players with an assigned role, with average usage and efficiency.</p>
      </div>
    </div>`;
}

/* ---------- ficha de equipo ---------- */
function pintarFicha(){
  const eq = fEquipo.value;
  if(!eq){
    libre.innerHTML = `<div class="panel"><div class="selector">
      Pick a team in the <b>Team</b> filter to open its full page.</div></div>`;
    return;
  }
  const info = datosEquipos().find(e => e.equipo === eq);
  if(!info){ libre.innerHTML = '<div class="panel"><div class="selector">No data with these filters.</div></div>'; return; }

  const roster = datosJugadores().filter(j => j.equipo === eq).sort((a,b) => b.minTot - a.minTot);
  const maxPmRoster = Math.max(1, ...roster.map(j => Math.abs(j.pm)));
  const quintetos = datosQuintetos().filter(q => q.equipo === eq)
    .sort((a,b) => b.minTot - a.minTot).slice(0, 8);
  const maxPmQ = Math.max(1, ...quintetos.map(q => Math.abs(q.pm)));
  const juegos = S.juegos.filter(g => g.local === eq || g.visita === eq).sort((a,b) => b.fecha.localeCompare(a.fecha));
  const maxMargen = Math.max(1, ...juegos.map(g => Math.abs(g.pts_local - g.pts_visita)));

  const filasRoster = roster.map(j => `<tr>
    <td class="txt">${esc(j.jugador)}</td>
    <td class="txt">${j.rol ? `<span class="rol">${esc(j.rol)}</span>` : '—'}</td>
    <td>${j.gp}</td><td>${ent(j.minTot)}</td><td>${n1(j.pts)}</td><td>${n1(j.reb)}</td>
    <td>${n1(j.ast)}</td><td>${n1(j.ts)}</td><td>${n1(j.usg)}</td>
    ${celdaPM(j.pm, maxPmRoster)}</tr>`).join('');

  const filasQ = quintetos.map(q => `<tr>
    <td class="txt"><div class="quinteto">${q.lineup.split(' | ').map(p => `<span>${esc(p)}</span>`).join('')}</div></td>
    <td>${q.gp}</td><td>${n1(q.minTot)}</td><td>${n1(q.ortg)}</td><td>${n1(q.drtg)}</td>
    ${celdaPM(q.pm, maxPmQ)}</tr>`).join('');

  const filasJ = juegos.map(g => {
    const local = g.local === eq;
    const pf = local ? g.pts_local : g.pts_visita, pc = local ? g.pts_visita : g.pts_local;
    const rival = local ? g.visita : g.local;
    return `<tr><td class="txt">${g.fecha}</td>
      <td class="txt">${local ? 'vs' : '@'} <span class="equipo eqlink" data-eq="${rival}">${rival}</span></td>
      <td style="color:${pf > pc ? 'var(--verde)' : 'var(--neg)'}">${pf > pc ? 'W' : 'L'}</td>
      <td>${pf}-${pc}</td>
      ${celdaPM(pf-pc, maxMargen)}</tr>`;
  }).join('');

  libre.innerHTML = `
    <div class="ficha">
      <div><div class="cod">${info.equipo}</div><div class="nom">${esc(info.nombre)}</div></div>
      <div class="mets">
        <div><b>${info.w}-${info.l}</b><span>Record</span></div>
        <div><b>${n1(info.ortg)}</b><span>Offense</span></div>
        <div><b>${n1(info.drtg)}</b><span>Defense</span></div>
        <div><b class="${info.net >= 0 ? 'pos':'neg2'}">${firma(info.net)}</b><span>Net</span></div>
        <div><b>${n1(info.pace)}</b><span>Pace</span></div>
        <div><b>${n1(info.efg)}</b><span>eFG%</span></div>
      </div>
    </div>
    <div class="caja" style="margin-top:16px">
      <h3>Roster · sorted by minutes</h3>
      <div class="scroll" style="max-height:none"><table>
        <thead><tr><th class="txt">Player</th><th class="txt">Offensive role</th><th>GP</th><th>MIN</th>
          <th>PTS</th><th>REB</th><th>AST</th><th>TS%</th><th>USG%</th><th>+/-</th></tr></thead>
        <tbody>${filasRoster}</tbody></table></div>
    </div>
    <div class="rejilla">
      <div class="caja">
        <h3>Most-used lineups</h3>
        <div class="scroll" style="max-height:none"><table>
          <thead><tr><th class="txt">Lineup</th><th>GP</th><th>MIN</th><th>ORtg</th><th>DRtg</th><th>+/-</th></tr></thead>
          <tbody>${filasQ}</tbody></table></div>
      </div>
      <div class="caja">
        <h3>Game log</h3>
        <div class="scroll" style="max-height:none"><table>
          <thead><tr><th class="txt">Date</th><th class="txt">Opponent</th><th>W/L</th><th>Score</th><th>Margin</th></tr></thead>
          <tbody>${filasJ}</tbody></table></div>
      </div>
    </div>`;
}

/* ---------- render principal ---------- */
function pintar(reiniciar){
  const v = S.vista;
  if(reiniciar) S.pagina = 1;

  titulo.textContent = TITULOS[v];
  const esTabla = !['liga','ficha'].includes(v);
  panelTabla.hidden = !esTabla;
  libre.innerHTML = '';

  campoMin.style.display    = (v === 'jugadores' || v === 'quintetos') ? '' : 'none';
  campoMinJ.style.display   = (v === 'jugadores') ? '' : 'none';
  campoRol.style.display    = (v === 'jugadores' || v === 'liga') ? '' : 'none';
  campoModo.style.display   = (esTabla && fTipo.value !== 'roles') ? '' : 'none';
  campoTipo.style.display   = esTabla ? '' : 'none';
  campoCalidad.style.display = (v === 'equipos' || v === 'liga') ? 'none' : '';
  campoRival.style.display  = (v === 'ficha') ? 'none' : '';
  [campoSede, campoRes, campoUlt].forEach(c => c.style.display = (v === 'liga') ? 'none' : '');

  if(v === 'liga'){ pintarLiga(); enlazarEquipos(); return; }
  if(v === 'ficha'){ pintarFicha(); enlazarEquipos(); return; }

  let datos = ({equipos:datosEquipos, jugadores:datosJugadores,
                quintetos:datosQuintetos, juegos:datosJuegos})[v]();

  if(v === 'jugadores' && fTipo.value === 'roles'){
    const prom = promediosPorRol(datos);
    datos = datos.filter(j => j.rol).map(j => ({...j,
      tsDif:  isFinite(j.ts)   && prom[j.rol] ? j.ts   - prom[j.rol].ts   : NaN,
      usgDif: isFinite(j.usg)  && prom[j.rol] ? j.usg  - prom[j.rol].usg  : NaN,
      tparDif:isFinite(j.tpar) && prom[j.rol] ? j.tpar - prom[j.rol].tpar : NaN}));
  }

  const [campo, dir] = S.orden[v];
  datos.sort((a,b) => {
    const x = a[campo], y = b[campo];
    if(typeof x === 'string') return dir === 'asc' ? x.localeCompare(y) : y.localeCompare(x);
    const xa = isFinite(x) ? x : -Infinity, ya = isFinite(y) ? y : -Infinity;
    return dir === 'asc' ? xa-ya : ya-xa;
  });

  const paginas = Math.max(1, Math.ceil(datos.length / S.porPagina));
  if(S.pagina > paginas) S.pagina = paginas;
  conteo.textContent = datos.length.toLocaleString('en-US') + ' rows ·';
  dePag.textContent = 'of ' + paginas;
  fPagina.innerHTML = Array.from({length:paginas}, (_,i) =>
    `<option value="${i+1}"${i+1 === S.pagina ? ' selected' : ''}>${i+1}</option>`).join('');
  bPrev.disabled = S.pagina <= 1; bNext.disabled = S.pagina >= paginas;

  aviso.hidden = true;
  if(fTipo.value === 'roles' && v !== 'juegos'){
    aviso.hidden = false;
    aviso.innerHTML = v === 'jugadores'
      ? `Every player measured against the average of his own archetype: <b>+3.0 in TS% vs role</b> means three ` +
        `points of efficiency above the other players with that same role. Only the ` +
        `${Object.keys(S.roles).length} players with an assigned role appear here.`
      : v === 'quintetos'
      ? `<b>G-W-B</b> is the shape of the lineup: guards, wings and bigs. A <b>1-3-1</b> plays one creator with ` +
        `three wings; a <b>2-1-2</b> is two guards and two bigs. The amber number flags players with no ` +
        `assigned role.`
      : `How each team splits its minutes between guards, wings and bigs, with the shooting efficiency of each ` +
        `group. It shows which kind of player every coach trusts with the ball.`;
  } else if(v === 'quintetos' && !fCalidad.value && S.incompletos){
    aviso.hidden = false;
    aviso.innerHTML = `Lineups reconstructed from the official play-by-play and validated against the box score. ` +
      `In ${S.incompletos} of ${S.juegos.length} games the source publishes incomplete substitutions, so part of ` +
      `their time is unattributed; exclude them with <b>Data quality → Complete games only</b>.`;
  }

  const cols = COLS[v][fTipo.value] || COLS[v].trad;
  const pagina = datos.slice((S.pagina-1)*S.porPagina, S.pagina*S.porPagina);

  if(!datos.length){
    salida.innerHTML = '<div class="vacio">No rows match these filters. Try clearing them.</div>';
    return;
  }

  const rangos = {};
  cols.filter(c => c.heat).forEach(c => {
    const vals = datos.map(r => r[c.k]).filter(isFinite);
    rangos[c.k] = [Math.min(...vals), Math.max(...vals)];
  });
  const maxPm = Math.max(1, ...datos.map(r => Math.abs(isFinite(r.pm) ? r.pm : 0)));

  const th = ['<th class="txt rank">#</th>'].concat(cols.map(c =>
    `<th class="${c.txt?'txt':''}" data-col="${c.k}"${campo === c.k ? ` data-dir="${dir}"` : ''}>${c.t}</th>`)).join('');

  const tr = pagina.map((r,i) => {
    const tds = cols.map(c => {
      const val = r[c.k];
      if(c.pm) return celdaPM(val, maxPm);
      const txt = c.f ? c.f(val, r) : (typeof val === 'number' ? ent(val) : esc(val));
      let estilo = '';
      if(c.heat && isFinite(val)){
        const [lo,hi] = rangos[c.k];
        let p = hi > lo ? (val-lo)/(hi-lo) : .5;
        if(c.heat < 0) p = 1-p;
        estilo = ` style="background:rgba(27,88,173,${(p*.28).toFixed(3)})"`;
      }
      return `<td class="${c.txt?'txt':''}${c.dato?' dato':''}"${estilo}>${txt}</td>`;
    }).join('');
    return `<tr><td class="txt rank">${(S.pagina-1)*S.porPagina + i + 1}</td>${tds}</tr>`;
  }).join('');

  salida.innerHTML = `<table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
  salida.querySelectorAll('th[data-col]').forEach(el => el.addEventListener('click', () => {
    const k = el.dataset.col;
    S.orden[v] = (S.orden[v][0] === k && S.orden[v][1] === 'desc') ? [k,'asc'] : [k,'desc'];
    pintar(true);
  }));
  enlazarEquipos();
  salida.scrollTop = 0;
}

/* clic en el código de un equipo -> abre su ficha */
function enlazarEquipos(){
  document.querySelectorAll('[data-eq]').forEach(el => el.addEventListener('click', ev => {
    ev.stopPropagation();
    fEquipo.value = el.dataset.eq;
    irA('ficha');
  }));
}

function irA(vista){
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x.dataset.vista === vista));
  S.vista = vista;
  pintar(true);
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- eventos ---------- */
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => irA(b.dataset.vista)));
['fTipo','fEquipo','fRival','fRol','fModo','fSede','fResultado','fUltimos','fDesde','fHasta','fMin','fMinJ','fCalidad']
  .forEach(id => document.getElementById(id).addEventListener('input', () => pintar(true)));
fPagina.addEventListener('change', () => { S.pagina = +fPagina.value; pintar(); });
bPrev.addEventListener('click', () => { S.pagina--; pintar(); });
bNext.addEventListener('click', () => { S.pagina++; pintar(); });
bReset.addEventListener('click', () => {
  ['fEquipo','fRival','fRol','fSede','fResultado','fUltimos','fDesde','fHasta'].forEach(id => document.getElementById(id).value = '');
  fModo.value = 'juego'; fMin.value = 0; fMinJ.value = '5'; fTipo.value = 'trad'; fCalidad.value = '';
  pintar(true);
});

cargar();
</script>
</body>
</html>
